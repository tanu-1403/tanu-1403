<svg width="680" height="120" viewBox="0 0 680 120" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes sh{0%{opacity:0;transform:translate(0,0)}8%{opacity:1}85%{opacity:.7}100%{opacity:0;transform:translate(180px,75px)}}
    @keyframes sh2{0%{opacity:0;transform:translate(0,0)}8%{opacity:1}85%{opacity:.7}100%{opacity:0;transform:translate(140px,58px)}}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    .s1{animation:tw 2.6s ease-in-out infinite}
    .s2{animation:tw 3.8s ease-in-out infinite}
    .s3{animation:tw 4.9s ease-in-out infinite}
    .s4{animation:tw 2.1s ease-in-out infinite}
    .shoot{animation:sh 5.5s ease-in 1s infinite;transform-origin:500px 28px}
    .shoot2{animation:sh2 5.5s ease-in 4.2s infinite;transform-origin:310px 18px}
    .name{animation:fi 1.2s .3s both}
    .sub{animation:fi 1s .9s both}
  </style>
  <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#e8d0ff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#fff0ff" stop-opacity="1"/>
  </linearGradient>
  <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#e8d0ff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#fff0ff" stop-opacity="1"/>
  </linearGradient>
</defs>

<rect width="680" height="120" fill="#060914"/>
<rect width="680" height="120" fill="url(#nb)"/>
<defs>
  <radialGradient id="nb" cx="30%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#3c1464" stop-opacity=".25"/>
    <stop offset="100%" stop-color="#060914" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- stars -->
<g class="s1">
  <circle cx="38" cy="12" r=".9" fill="#dcd4ff" opacity=".6"/>
  <circle cx="130" cy="28" r="1.1" fill="#e8e0ff" opacity=".5"/>
  <circle cx="240" cy="9" r=".8" fill="#dcd4ff" opacity=".7"/>
  <circle cx="420" cy="18" r=".9" fill="#e0d8ff" opacity=".5"/>
  <circle cx="580" cy="11" r="1" fill="#e8e0ff" opacity=".55"/>
  <circle cx="650" cy="32" r=".8" fill="#dcd4ff" opacity=".65"/>
  <circle cx="72" cy="65" r=".7" fill="#dcd4ff" opacity=".45"/>
  <circle cx="310" cy="72" r=".8" fill="#e0d8ff" opacity=".5"/>
  <circle cx="610" cy="80" r=".9" fill="#dcd4ff" opacity=".5"/>
</g>
<g class="s2">
  <circle cx="90" cy="18" r=".9" fill="#e8e0ff" opacity=".5"/>
  <circle cx="175" cy="38" r=".8" fill="#dcd4ff" opacity=".6"/>
  <circle cx="350" cy="14" r="1" fill="#e0d8ff" opacity=".55"/>
  <circle cx="500" cy="35" r=".9" fill="#dcd4ff" opacity=".5"/>
  <circle cx="20" cy="45" r=".7" fill="#e8e0ff" opacity=".45"/>
  <circle cx="450" cy="78" r=".8" fill="#dcd4ff" opacity=".5"/>
  <circle cx="560" cy="60" r=".7" fill="#e0d8ff" opacity=".55"/>
</g>
<g class="s3">
  <circle cx="55" cy="38" r=".8" fill="#dcd4ff" opacity=".55"/>
  <circle cx="200" cy="22" r=".9" fill="#e8e0ff" opacity=".5"/>
  <circle cx="480" cy="12" r=".8" fill="#dcd4ff" opacity=".6"/>
  <circle cx="620" cy="48" r=".7" fill="#e0d8ff" opacity=".5"/>
  <circle cx="155" cy="75" r=".8" fill="#dcd4ff" opacity=".45"/>
  <circle cx="380" cy="88" r=".7" fill="#e8e0ff" opacity=".4"/>
</g>
<g class="s4">
  <circle cx="270" cy="50" r="1.2" fill="#e8e0ff" opacity=".7"/>
  <circle cx="410" cy="60" r="1.1" fill="#dcd4ff" opacity=".75"/>
  <circle cx="540" cy="22" r="1.3" fill="#e0d8ff" opacity=".7"/>
</g>

<!-- shooting star 1 -->
<g class="shoot">
  <line x1="420" y1="28" x2="340" y2="28" stroke="url(#sg)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="420" cy="28" r="1.4" fill="#fff8ff" opacity=".9"/>
</g>

<!-- shooting star 2 -->
<g class="shoot2">
  <line x1="310" y1="18" x2="240" y2="18" stroke="url(#sg2)" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="310" cy="18" r="1.1" fill="#fff8ff" opacity=".85"/>
</g>

<!-- name -->
<text class="name" x="340" y="68" text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="36" font-weight="300"
  fill="#f0eaff" letter-spacing="-1" opacity=".95">Tanya
  <tspan font-style="italic" fill="#c8a8f0"> Chaurasia</tspan>
</text>

<!-- tagline -->
<text class="sub" x="340" y="90" text-anchor="middle"
  font-family="Arial, sans-serif"
  font-size="10" fill="#5a4870" letter-spacing="2.5">
  navigating data like stars — finding patterns in the dark
</text>

<!-- bottom fade -->
<rect x="0" y="96" width="680" height="24" fill="url(#bf)"/>
<defs>
  <linearGradient id="bf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060914" stop-opacity="0"/>
    <stop offset="100%" stop-color="#060914" stop-opacity=".6"/>
  </linearGradient>
</defs>
</svg>
